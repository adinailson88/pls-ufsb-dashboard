name: Validar site estatico

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatorios
        run: |
          test -s index.html
          test -s css/estilo.css
          test -s js/config.js
          test -s js/dados.js
          test -s js/graficos.js
          test -s js/main.js
          test -s dados/acoes.csv
          test -s dados/eixos.csv
          test -s dados/indicadores_anuais.csv

      - name: Validar sintaxe JavaScript
        run: |
          for arquivo in js/*.js; do
            node --check "$arquivo"
          done

      - name: Validar arquivos CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          arquivos = sorted(Path("dados").glob("*.csv"))
          if not arquivos:
              raise SystemExit("Nenhum CSV encontrado em dados/.")

          for arquivo in arquivos:
              with arquivo.open(encoding="utf-8-sig", newline="") as entrada:
                  linhas = list(csv.reader(entrada))
              if len(linhas) < 2:
                  raise SystemExit(f"CSV sem registros: {arquivo}")
              if not any(celula.strip() for celula in linhas[0]):
                  raise SystemExit(f"CSV sem cabecalho: {arquivo}")
              print(f"OK {arquivo}: {len(linhas) - 1} registro(s)")
          PY
